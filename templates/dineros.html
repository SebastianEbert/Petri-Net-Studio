<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DiNeROS Studio</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        :root {
            --bg-color: #fafbfc; --dot-color: #cbd5e1; --panel-bg: rgba(255, 255, 255, 0.85);
            --primary: #4f46e5; --text-main: #0f172a; --text-muted: #64748b;
            --border-light: rgba(226, 232, 240, 0.8); --danger: #ef4444; --hover-bg: rgba(241, 245, 249, 0.8);
            --zoom-bg: #ffffff; --zoom-hover: #f1f5f9;
        }

        body.dark-mode {
            --bg-color: #0f172a; --dot-color: #334155; --panel-bg: rgba(30, 41, 59, 0.85);
            --text-main: #ffffff; --text-muted: #cbd5e1; --border-light: rgba(71, 85, 105, 0.8);
            --hover-bg: rgba(51, 65, 85, 0.8); --zoom-bg: #1e293b; --zoom-hover: #334155; --primary: #00bfff; 
        }

        body { margin: 0; display: flex; height: 100vh; font-family: 'Inter', system-ui, sans-serif; overflow: hidden; background-color: var(--bg-color); color: var(--text-main); user-select: none; transition: background-color 0.3s ease; }
        #canvas-container { flex-grow: 1; position: relative; background-color: var(--bg-color); transition: background-color 0.3s ease; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: default; }

        .glass-panel { background: var(--panel-bg); backdrop-filter: blur(16px); border: 1px solid var(--border-light); border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2); transition: background 0.3s ease, border-color 0.3s ease; }

        #toolbars-container { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 10px; align-items: center; z-index: 100; }
        .toolbar { display: flex; align-items: center; gap: 4px; padding: 8px; }
        #file-menu { position: absolute; top: 20px; left: 20px; display: flex; align-items: center; gap: 8px; padding: 8px 12px; z-index: 100;}
        #layout-menu { position: absolute; top: 20px; right: 20px; display: flex; align-items: center; gap: 4px; padding: 8px; z-index: 100;}
        #theme-toggle { position: absolute; bottom: 30px; left: 30px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; border-radius: 12px; padding: 0; color: var(--text-main); z-index: 100;}
        
        #model-name-display { font-size: 14px; font-weight: 700; color: var(--primary); padding: 0 12px; cursor: pointer; border-right: 1px solid var(--border-light); transition: color 0.2s; }
        #model-name-display:hover { text-decoration: underline; }
        #model-name-display.dirty { color: var(--danger); }

        #zoom-controls { position: absolute; bottom: 30px; right: 30px; display: flex; flex-direction: column; align-items: center; border-radius: 12px; border: 1px solid var(--border-light); background: var(--zoom-bg); z-index: 9999;}
        .zoom-btn { background: transparent; border: none; width: 44px; height: 44px; font-size: 22px; font-weight: 500; color: var(--text-main); cursor: pointer; transition: background 0.2s; }
        .zoom-btn:hover { background: var(--zoom-hover); }
        #zoom-label { font-size: 12px; font-weight: 700; color: var(--text-muted); padding: 8px 0; width: 100%; text-align: center; cursor: pointer; border-top: 1px solid var(--border-light); border-bottom: 1px solid var(--border-light); }

        .tool-btn { background: transparent; border: none; padding: 8px 12px; border-radius: 10px; font-size: 13px; font-weight: 600; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.2s ease; }
        .tool-btn:hover { color: var(--text-main); background: var(--hover-bg); }
        .tool-btn.active { background: var(--text-main); color: var(--bg-color); box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3); }
        .divider { width: 1px; height: 24px; background-color: var(--border-light); margin: 0 6px; }
        .tool-btn svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; flex-shrink: 0; }
        
        #toast { position: absolute; top: 70px; left: 50%; transform: translateX(-50%); background: #10b981; color: white; padding: 8px 24px; border-radius: 20px; font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: all 0.3s; z-index: 1000; }
        #toast.show { opacity: 1; top: 60px; }
        .inline-input { position: absolute; background: var(--bg-color); border: 2px dashed var(--primary); color: var(--text-main); font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 600; outline: none; padding: 2px 6px; border-radius: 6px; z-index: 1000; }
        .inline-input.timing { font-family: monospace; }
        .inline-input.meta { color: #ef4444; border-color: #ef4444; font-family: serif; font-style: italic; }

        #mqtt-feed { position: absolute; top: 75px; right: 20px; width: 320px; bottom: 100px; display: flex; flex-direction: column; z-index: 100; transform: translateX(0); opacity: 1; pointer-events: auto; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease; }
        #mqtt-feed.hidden { transform: translateX(120%); opacity: 0; pointer-events: none; }
        .feed-header { padding: 12px 16px; border-bottom: 1px solid var(--border-light); display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 13px; }
        #mqtt-status { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background-color: var(--danger); margin-left: 8px; box-shadow: 0 0 8px currentColor; }
        .feed-content { flex-grow: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        .feed-entry { background: var(--bg-color); border: 1px solid var(--border-light); border-radius: 8px; padding: 8px 12px; font-family: monospace; font-size: 11px; word-break: break-all; transition: border-color 0.2s; }
        .feed-entry.success { border-left: 3px solid var(--target); }
        .feed-entry.error { border-left: 3px solid var(--danger); }
        .feed-entry.info { border-left: 3px solid var(--primary); }
        .feed-time { color: var(--text-muted); font-size: 10px; margin-bottom: 4px; display: block; }
    </style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="editor"></canvas>
        <div id="toast">Model Saved!</div>
        <input type="file" id="file-input" accept=".pnml,.xml" style="display: none;" />

        <nav id="file-menu" class="glass-panel">
            <span id="model-name-display" title="Click to rename model">Untitled_Dineros_Net</span>
            <button class="tool-btn" id="btn-open"><svg viewBox="0 0 24 24"><path d="M3 7v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-6l-2-2H5a2 2 0 0 0-2 2z"></path></svg> Open</button>
            <button class="tool-btn" id="btn-save"><svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg> Save</button>
        </nav>

        <nav id="layout-menu" class="glass-panel">
            <button class="tool-btn" id="btn-autolayout" style="color: var(--primary);"><svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg> Auto Layout</button>
            <div class="divider"></div>
            <button class="tool-btn" id="btn-toggle-feed"><svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg> Feed</button>
        </nav>

        <div id="mqtt-feed" class="glass-panel hidden">
            <div class="feed-header">
                <div>📡 MQTT Feed <span id="mqtt-status"></span></div>
            </div>
            <div id="feed-content" class="feed-content"></div>
        </div>

        <button id="theme-toggle" class="glass-panel" title="Toggle Dark Mode">🌙</button>

        <div id="toolbars-container">
            <nav id="toolbar-standard" class="glass-panel toolbar">
                <span style="font-size: 11px; font-weight: bold; color: var(--text-muted); padding-left: 8px;">CORE</span>
                <div class="divider"></div>
                <button class="tool-btn active" data-tool="Select"><svg viewBox="0 0 24 24"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"></path><path d="M13 13l6 6"></path></svg> Select</button>
                <div class="divider"></div>
                <button class="tool-btn" data-tool="Place"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"></circle></svg> Place</button>
                <button class="tool-btn" data-tool="Transition"><svg viewBox="0 0 24 24"><rect x="6" y="4" width="12" height="16" rx="2"></rect></svg> Discrete Tx</button>
                <button class="tool-btn" data-tool="Timed Trans"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"></rect><circle cx="12" cy="12" r="4"></circle><polyline points="12 10 12 12 14 12"></polyline></svg> Timed Tx</button>
                <button class="tool-btn" data-tool="Ref Place"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" stroke-dasharray="3 3"></circle></svg> Ref Place</button>
                <button class="tool-btn" data-tool="Ref Transition"><svg viewBox="0 0 24 24"><rect x="6" y="4" width="12" height="16" rx="2" stroke-dasharray="3 3"></rect></svg> Ref Tx</button>
                <button class="tool-btn" data-tool="Page"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"></rect><line x1="3" y1="10" x2="21" y2="10"></line></svg> Page</button>
                <div class="divider"></div>
                <button class="tool-btn" data-tool="Arc"><svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg> Arc</button>
                <button class="tool-btn" data-tool="Inhibitor"><svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="15" y2="12"></line><circle cx="17" cy="12" r="2"></circle></svg> Inhibitor</button>
                <button class="tool-btn" data-tool="Token" title="Shift-click to remove tokens"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="currentColor" stroke="none"></circle></svg> Token</button>
                <div class="divider"></div>
                <button class="tool-btn" data-tool="Delete" style="color: var(--danger);"><svg viewBox="0 0 24 24"><path d="M3 6h18"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg> Eraser</button>
            </nav>

            <nav id="toolbar-dineros" class="glass-panel toolbar">
                <span style="font-size: 11px; font-weight: bold; color: var(--primary); padding-left: 8px;">DiNeROS</span>
                <div class="divider"></div>
                <button class="tool-btn" data-tool="NodePage"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"></rect><path d="M6 12h12"></path></svg> Node</button>
                <button class="tool-btn" data-tool="CBGroupPage"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4" stroke-dasharray="4 4"></rect></svg> CB Group</button>
                <div class="divider"></div>
                <button class="tool-btn" data-tool="TimerPage"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><polyline points="12 7 12 12 15 15"></polyline></svg> Timer</button>
                <button class="tool-btn" data-tool="SubPage"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z"></path><polyline points="4 8 12 14 20 8"></polyline></svg> Sub</button>
                <button class="tool-btn" data-tool="ServerPage"><svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="8" rx="2"></rect><rect x="2" y="14" width="20" height="8" rx="2"></rect><line x1="6" y1="6" x2="6.01" y2="6"></line><line x1="6" y1="18" x2="6.01" y2="18"></line></svg> Server</button>
                <div class="divider"></div>
                <button class="tool-btn" data-tool="TopicPage"><svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg> Topic</button>
                <button class="tool-btn" data-tool="ServicePage"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg> Service</button>
                <div class="divider"></div>
                
                <button class="tool-btn" data-tool="Start Place"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"></circle><polygon points="10,8 15,12 10,16" fill="currentColor"></polygon></svg> Start P</button>
                <button class="tool-btn" data-tool="End Place"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"></circle><rect x="9" y="9" width="6" height="6" fill="currentColor"></rect></svg> End P</button>
                <button class="tool-btn" data-tool="Start Tx"><svg viewBox="0 0 24 24"><rect x="6" y="4" width="12" height="16" rx="2"></rect><polygon points="9,9 15,12 9,15" fill="currentColor"></polygon></svg> Start Tx</button>
                <button class="tool-btn" data-tool="End Tx"><svg viewBox="0 0 24 24"><rect x="6" y="4" width="12" height="16" rx="2"></rect><rect x="9" y="9" width="6" height="6" fill="currentColor"></rect></svg> End Tx</button>
            </nav>
        </div>

        <div id="zoom-controls">
            <button class="zoom-btn" id="zoom-in">+</button>
            <div id="zoom-label">100%</div>
            <button class="zoom-btn" id="zoom-out">−</button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/dineros.js') }}"></script>
</body>
</html>
